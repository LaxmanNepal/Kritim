<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Laxman AI — a Khoj-powered personal AI workspace.">
  <title>Laxman AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">✦</div><div><strong>Laxman AI</strong><span>Khoj Workspace</span></div></div>
      <button class="new-chat" id="newChat">＋ New chat</button>
      <nav>
        <button class="nav-item active" data-view="chat">⌘ <span>Chat</span></button>
        <button class="nav-item" data-view="knowledge">◈ <span>Knowledge</span></button>
        <button class="nav-item" data-view="research">◎ <span>Research</span></button>
        <button class="nav-item" data-view="agents">◇ <span>Agents</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" id="settingsBtn">⚙ <span>Settings</span></button>
        <div class="connection"><i id="statusDot"></i><span id="statusText">Khoj not connected</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar"><button class="menu" id="menu">☰</button><div class="crumb" id="crumb">Chat</div><button class="top-action" id="connectBtn">Connect Khoj</button></header>
      <section class="content" id="content">
        <div class="welcome" id="welcome">
          <div class="orb">✦</div>
          <p class="eyebrow">PERSONAL AI WORKSPACE</p>
          <h1>What can I help you<br><span>build today?</span></h1>
          <p class="sub">Chat with your knowledge, research the web, and build useful AI workflows — powered by your self-hosted Khoj backend.</p>
          <div class="cards">
            <button class="prompt-card" data-prompt="Search my knowledge and summarize the most useful information."><b>◈</b><span><strong>Search my knowledge</strong><small>Find answers across your connected sources</small></span>→</button>
            <button class="prompt-card" data-prompt="Research the latest information about AI tools and give me a concise report."><b>◎</b><span><strong>Deep research</strong><small>Research a topic and synthesize the results</small></span>→</button>
            <button class="prompt-card" data-prompt="Help me plan and organize my next project."><b>◇</b><span><strong>Plan a project</strong><small>Turn an idea into practical next steps</small></span>→</button>
          </div>
        </div>
        <div class="chat" id="chat" hidden></div>
        <div class="panel" id="panel" hidden></div>
      </section>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Ask Laxman AI anything…"></textarea>
        <button type="submit" aria-label="Send">↑</button>
      </form>
      <div class="hint">Laxman AI · Self-hosted Khoj · No API keys are stored in this frontend</div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
